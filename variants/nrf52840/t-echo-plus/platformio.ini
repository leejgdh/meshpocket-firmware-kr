[env:t-echo-plus]
extends = nrf52840_base
board = t-echo
board_level = pr
board_check = true
debug_tool = jlink

build_flags = ${nrf52840_base.build_flags}
  -DTTGO_T_ECHO_PLUS
  -Ivariants/nrf52840/t-echo-plus
  -DEINK_DISPLAY_MODEL=GxEPD2_154_D67
  -DEINK_WIDTH=200
  -DEINK_HEIGHT=200
  -DUSE_EINK
  -DUSE_EINK_DYNAMICDISPLAY            ; Enable Dynamic EInk
  -DEINK_LIMIT_FASTREFRESH=20          ; How many consecutive fast-refreshes are permitted
  -DEINK_BACKGROUND_USES_FAST          ; (Optional) Use FAST refresh for both BACKGROUND and RESPONSIVE, until a limit is reached.
  -DI2C_NO_RESCAN

build_src_filter = ${nrf52_base.build_src_filter} +<../variants/nrf52840/t-echo-plus>

lib_deps =
  ${nrf52840_base.lib_deps}
  https://github.com/meshtastic/GxEPD2/archive/55f618961db45a23eff0233546430f1e5a80f63a.zip
  lewisxhe/PCF8563_Library@^1.0.1
  adafruit/Adafruit DRV2605 Library@1.2.4

[env:t-echo-plus-inkhud]
extends = nrf52840_base, inkhud
board = t-echo
board_level = pr
board_check = true
debug_tool = jlink
build_flags =
  ${nrf52840_base.build_flags}
  ${inkhud.build_flags}
  -DINKHUD_UNIFIED_ONLY                 ; Use only CJK bitmap font, exclude legacy FreeSans fonts
  -DTTGO_T_ECHO_PLUS
  -Ivariants/nrf52840/t-echo-plus
  -DI2C_NO_RESCAN
build_src_filter =
  ${nrf52_base.build_src_filter}
  ${inkhud.build_src_filter}
  +<../variants/nrf52840/t-echo-plus>
lib_deps =
  ${inkhud.lib_deps} ; InkHUD libs first, so we get GFXRoot instead of AdafruitGFX
  ${nrf52840_base.lib_deps}
  lewisxhe/PCF8563_Library@^1.0.1
  adafruit/Adafruit DRV2605 Library@1.2.4
lib_ignore =
  Adafruit GFX Library        ; InkHUD uses GFX_Root, not AdafruitGFX
  GxEPD2                      ; InkHUD has its own e-ink drivers

; InkHUD2 - New experimental graphics architecture
; Motion sensor libraries removed:
;   - T-Echo Plus has BHI260AP IMU, but Meshtastic doesn't support it
;   - BHI260AP would only provide wake-on-motion (no compass - lacks magnetometer)
;   - Wake-on-motion is pointless for e-ink device (screen always visible)
;   - Removed: MPU6050, LIS3DH, LSM6DS, ICM20948, BMM150 libs (~17KB saved)
[env:t-echo-plus-inkhud2]
extends = nrf52_base, inkhud
board = t-echo
board_level = pr
board_check = true
debug_tool = jlink
build_flags =
  ${nrf52_base.build_flags}
  ${inkhud.build_flags}
  -DSERIAL_BUFFER_SIZE=4096             ; From nrf52840_base
  -DUSE_INKHUD2                         ; Enable new InkHUD2 architecture
  -DTTGO_T_ECHO_PLUS
  -Ivariants/nrf52840/t-echo-plus
  -DI2C_NO_RESCAN
build_src_filter =
  ${nrf52_base.build_src_filter}
  ${inkhud.build_src_filter}
  +<../variants/nrf52840/t-echo-plus>
lib_deps =
  ${inkhud.lib_deps}                    ; GFX_Root for e-ink driver
  ${nrf52_base.lib_deps}                ; Core: arduino_base + RadioLib + Crypto
  ; nRF52840 specific
  https://github.com/Kongduino/Adafruit_nRFCrypto/archive/8cde7189b5ead9dcd49f72601b43b969c0bbc06e.zip
  ; T-Echo Plus specific
  lewisxhe/PCF8563_Library@^1.0.1       ; RTC
  adafruit/Adafruit DRV2605 Library@1.2.4  ; Haptic
  ; Optional environmental sensor (some T-Echo Plus units have BME280)
  adafruit/Adafruit BME280 Library@2.3.0
lib_ignore =
  Adafruit GFX Library                  ; InkHUD uses GFX_Root
  GxEPD2                                ; InkHUD has own e-ink drivers
